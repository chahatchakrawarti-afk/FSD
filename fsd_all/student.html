<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks System</title>
</head>
<body>
  <h2>Student Marks System</h2>

  <!-- Static Table -->
  <table border="1" cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Marks</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Chitransh</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Rahul</td>
        <td>90</td>
      </tr>
      <tr>
        <td>Priya</td>
        <td>78</td>
      </tr>
    </tbody>
  </table>

  <br>

  <!-- Input fields (non-functional in pure HTML) -->
  <input type="text" placeholder="Enter name">
  <input type="number" placeholder="Enter marks">

  <br><br>
  <!-- Static buttons (non-functional in pure HTML) -->
  <button>Add Student</button>
  <button>Show Highest</button>
  <button>Show Average</button>
  <button>Sort by Marks</button>
  <button>Remove Last</button>

  <p><b>Result:</b> </p>

</body>
</html>
